name: pizza-basilico

# Ce VPS héberge déjà d'autres projets derrière un Caddy partagé (jobsniper,
# travelapp, pz.mehdi.website) qui possède seul les ports 80/443. Ce compose
# ne lance donc pas de Caddy propre : l'app publie son port sur l'hôte
# (convention déjà utilisée par les projets voisins), et le Caddy partagé
# (/home/ubuntu/jobsniper/Caddyfile) fait reverse_proxy vers 172.17.0.1:3003.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pizza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: pizza_basilico
    volumes:
      - pizza_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizza -d pizza_basilico"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Pas de port publié sur l'hôte : uniquement accessible depuis le
    # conteneur `app` via le réseau interne du projet.

  app:
    build:
      context: .
      args:
        # Figées dans le bundle client au build — voir la note dans le Dockerfile.
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pizza:${POSTGRES_PASSWORD}@db:5432/pizza_basilico?schema=public
    ports:
      - "3003:3000"

volumes:
  pizza_db_data:
